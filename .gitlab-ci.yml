################################################################################
# GitLab CI for the Varbase AI Answers Base recipe: validate composer.json (build), lint
# every YAML file (validate), then apply the recipe twice on a fresh Varbase 11
# site and run the Varbase functional testing suite on it (test).
################################################################################

stages:
  - build
  - validate
  - test

variables:
  # Drupal 11.4.0 released 2026-07-01; pinned templates ref $CORE_STABLE is still 11.3.
  DRUPAL_CORE: "11.4.0"
  IGNORE_PROJECT_DRUPAL_CORE_VERSION: "1"
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_MEMORY_LIMIT: "-1"

# Run for merge requests and branch pushes.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# = build = validate the recipe's composer.json (schema + metadata, offline).
build:composer-validate:
  stage: build
  image: composer:2
  script:
    - composer --version
    - composer validate --no-check-all --no-check-publish

# = validate = lint every YAML file (recipe.yml + config/*) for syntax errors.
validate:yaml-lint:
  stage: validate
  image: python:3.12-slim
  script:
    - python --version
    - pip install --quiet pyyaml
    - |
      python - <<'PY'
      import glob, sys, yaml
      bad = 0
      for f in sorted(glob.glob('**/*.yml', recursive=True)):
          try:
              list(yaml.safe_load_all(open(f, encoding='utf-8')))
          except Exception as e:
              print('YAML ERROR:', f, '->', e); bad += 1
      print('Checked YAML files; errors:', bad)
      sys.exit(1 if bad else 0)
      PY

# = test = a fresh Varbase 11 site, the recipe applied twice, then the suite.
# AI calls go to an amazee.ai trial that Drupal CMS AI sets up: no key needed.
.varbase-e2e:
  stage: test
  needs: []
  image: registry.gitlab.com/drupal-infrastructure/drupalci/drupalci-environments/php-8.4-ubuntu-apache:production
  services:
    # MariaDB 11.8 LTS, as in DDEV: vector support needs 11.7 or later.
    - name: mariadb:11.8
      alias: database
  timeout: 60m
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: drupal
    MYSQL_USER: drupaltestbot
    MYSQL_PASSWORD: drupaltestbotpw
    LAUNCH_URL: "http://localhost"
    LOGIN_USER: "webmaster"
    LOGIN_PASS: "dD.123123ddd"
    HEADLESS: "true"
    SLOW_MO: "0"
    BROWSER: "chromium"
    _BUILD_DIR: "/tmp/site-build"
    RECIPE: "varbase_ai_answers_base"
    # System packages the suite needs, such as imagemagick for image uploads.
    APT_PACKAGES: "imagemagick"
    # Drupal CMS AI first: it sets up an amazee.ai trial as the default AI provider.
    PROVIDER_RECIPE: "drupal_cms_ai"
    # When set, the recipe must stop with this message before a provider is set up.
    NO_PROVIDER_MESSAGE: ""
    # Recipes applied before this one, in apply order; en:<module> enables a module.
    BEFORE_RECIPES: "varbase_ai_vdb_mariadb en:ai_answers"
    # Test with the dev line of the sibling recipes, not their last release.
    EXTRA_PACKAGES: "drupal/varbase_ai_search_base:1.0.x-dev drupal/varbase_ai_vdb_mariadb:1.0.x-dev drupal/varbase_starter:1.0.x-dev"
  artifacts:
    when: on_failure
    paths:
      - tests/reports
      - tests/screenshots
      - tests/videos
    expire_in: 1 week
  before_script:
    # Node 22 from the tarball.
    - curl -fsSL https://nodejs.org/dist/latest-v22.x/ -o /tmp/node-index.html
    - NODE_TARBALL=$(grep -oE 'node-v22\.[0-9.]+-linux-x64\.tar\.gz' /tmp/node-index.html | head -1)
    - curl -fsSL "https://nodejs.org/dist/latest-v22.x/$NODE_TARBALL" -o /tmp/node.tar.gz
    - tar -xzf /tmp/node.tar.gz -C /usr/local --strip-components=1
    # varbase-e2e's postinstall scaffolds files; keep ours.
    - cp cucumber.js /tmp/cucumber.js.bak
    - npm install --no-audit --no-fund
    - cp /tmp/cucumber.js.bak cucumber.js
    - git checkout -- tests/ playwright.config.ts 2>/dev/null || true
    - git clean -fdq tests/ 2>/dev/null || true
    - ./node_modules/.bin/playwright install --with-deps chromium
    # Varbase resizes images with ImageMagick; the image has no convert binary.
    - '[ -z "$APT_PACKAGES" ] || apt-get install -y -qq $APT_PACKAGES'
    # Varbase 11 with this recipe from the checkout.
    - composer create-project "drupal/varbase_project:~11.0.0" $_BUILD_DIR --no-interaction --no-progress --no-install
    - cd $_BUILD_DIR
    - composer config minimum-stability dev
    - composer config prefer-stable true
    - composer config allow-plugins true -n
    # Keep the recipes as packages: recipe-unpack would drop them from recipes/.
    - IGNORE=$(for p in drupal/$RECIPE $EXTRA_PACKAGES; do printf '"%s",' "${p%%:*}"; done)
    - composer config --json extra.drupal-recipe-unpack.ignore "[${IGNORE%,}]"
    - composer config repositories.recipe '{"type":"path","url":"'"$CI_PROJECT_DIR"'","options":{"symlink":false}}'
    - composer require "drupal/$RECIPE:*@dev" $EXTRA_PACKAGES --with-all-dependencies --no-interaction --no-progress
    - DRUSH="$_BUILD_DIR/$(composer config bin-dir)/drush --root=$_BUILD_DIR/web"
    - mkdir -p web/sites/default/files && chmod -R 777 web/sites/default/files
    - rm -rf /var/www/html && ln -s $_BUILD_DIR/web /var/www/html
    - $DRUSH site:install varbase --db-url=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE --account-name=webmaster --account-pass=$LOGIN_PASS --site-name="Varbase AI Answers Base CI" --locale=en install_configure_form.enable_update_status_emails=NULL -y
    # Varbase's form protection and login flood limits, off for the robot.
    - $DRUSH pm:uninstall antibot -y || true
    - $DRUSH config:set honeypot.settings time_limit 0 -y || true
    - $DRUSH config:set user.flood ip_limit 1000000 -y
    - $DRUSH config:set user.flood user_limit 1000000 -y
    # One testing user per Varbase editorial role, named after the role.
    - for role in content_editor content_admin seo_admin site_admin; do $DRUSH user:create $role --mail=$role@example.test --password=$LOGIN_PASS; $DRUSH user:role:add $role $role; done
    - $DRUSH user:create authenticated_user --mail=authenticated_user@example.test --password=$LOGIN_PASS
    - if [ -n "$NO_PROVIDER_MESSAGE" ]; then ! $DRUSH recipe $_BUILD_DIR/recipes/$RECIPE -y > /tmp/no-provider.log 2>&1 && grep -q "$NO_PROVIDER_MESSAGE" /tmp/no-provider.log && echo "Stopped without a provider, as expected."; fi
    - for r in $PROVIDER_RECIPE $BEFORE_RECIPES; do case $r in en:*) $DRUSH pm:enable "${r#en:}" -y;; tests/*) $DRUSH recipe "$CI_PROJECT_DIR/$r" -y;; *) $DRUSH recipe "$_BUILD_DIR/recipes/$r" -y;; esac; $DRUSH cache:rebuild; done
    # The amazee.ai trial signup can fail for a moment on amazee.ai's side; try it again before giving up.
    - EMBEDDINGS='echo \Drupal::config("ai.settings")->get("default_providers.embeddings.provider_id");'
    - for i in 1 2 3; do [ -n "$($DRUSH php:eval "$EMBEDDINGS")" ] && break; sleep 30; $DRUSH recipe $_BUILD_DIR/recipes/drupal_cms_ai -y; $DRUSH cache:rebuild; done
    - echo "Default embeddings provider - $($DRUSH php:eval "$EMBEDDINGS")"
    # Applied twice: the second run must change nothing and not fail.
    - $DRUSH recipe $_BUILD_DIR/recipes/$RECIPE -y
    - $DRUSH cache:rebuild
    - $DRUSH recipe $_BUILD_DIR/recipes/$RECIPE -y
    - $DRUSH cache:rebuild
    # The Ask AI Canvas pattern is a recipe of its own, applied after this one.
    - $DRUSH recipe $_BUILD_DIR/recipes/$RECIPE/patterns/ask_ai -y
    - $DRUSH cache:rebuild
    - $DRUSH recipe $_BUILD_DIR/recipes/$RECIPE/patterns/ask_ai -y
    - $DRUSH cache:rebuild
    # Cron embeds the content on a live site; embed it now so Ask AI has something to answer from.
    - $DRUSH search-api:index content_vector
  script:
    - chown -R www-data:www-data $_BUILD_DIR
    - service apache2 start
    # The first requests after a cache rebuild build the caches; make them before the suite.
    - for p in / /user/login; do curl -s -o /dev/null -w "Warm-up $p %{http_code} in %{time_total}s\n" "$LAUNCH_URL$p"; done
    - cd "$CI_PROJECT_DIR"
    - npm test

varbase-e2e-test:
  extends: .varbase-e2e
