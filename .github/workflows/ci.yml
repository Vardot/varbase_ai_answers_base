# Continuous integration for the Varbase AI Answers recipe.
#
# The repository is private, so this runs on GitHub Actions rather than the
# drupal.org GitLab templates the public Varbase recipes use. Two jobs:
#
#   lint    composer.json, every YAML file and the PHP test script.
#   recipe  a real Varbase 11 site, built as Vardot's public recipe CI builds
#           one (drupal/varbase_project 11.0.x-dev, installed from Varbase
#           Starter), on MariaDB 11.8, which is also the vector database. The
#           AI module's Echo test provider is the default embeddings model, so
#           no AI key is needed. Require this checkout and Varbase AI Search
#           (private: read with a deploy key, see README), enable AI Answers
#           first as the README says, apply the recipe once (it applies
#           Varbase AI Search, whose server cannot be re-created) and run
#           tests/verify.php.
#           Then it serves the site and runs the functional suite in
#           tests/features (Playwright + Cucumber through @vardot/varbase-e2e)
#           in Chromium.

name: CI

on:
  push:
    branches: ['1.0.x']
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  DRUPAL_CORE: '~11.4.0'
  RECIPE: varbase_ai_answers_base
  PACKAGE: vardot/varbase_ai_answers_base
  COMPOSER_NO_INTERACTION: '1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint YAML
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(set(glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True) + glob.glob('.github/**/*.yml', recursive=True)))
          bad = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f, encoding='utf-8')))
              except Exception as e:
                  print(f'::error file={f}::{e}')
                  bad += 1
          print(f'{len(files)} YAML files checked, {bad} with errors')
          sys.exit(1 if bad else 0)
          PY

      - name: No PHP in the recipe
        run: |
          # A recipe ships config only: no .php, .module, .install or .inc file.
          found=$(find . -path ./.git -prune -o -path ./vendor -prune -o -path ./node_modules -prune -o -type f \( -name '*.php' -o -name '*.module' -o -name '*.install' -o -name '*.inc' \) -print)
          if [ -n "$found" ]; then echo "::error::PHP files found: $found"; exit 1; fi
          echo 'No PHP files.'

  recipe:
    name: Apply on a Varbase 11 site with MariaDB vectors and Varbase AI Search
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # A throw-away test site. Composer 2.9 refuses packages with open security
      # advisories, and on 8 October 2026 every enshrined/svg-sanitize release,
      # which Varbase Media Base needs through svg_image, has one. Production
      # sites decide on advisories themselves; this site only has to build.
      COMPOSER_NO_SECURITY_BLOCKING: '1'
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: drupal
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          path: recipe

      # Varbase AI Search is private. VARBASE_AI_SEARCH_DEPLOY_KEY is the
      # private half of a read-only deploy key on that repository only.
      - uses: actions/checkout@v4
        with:
          repository: Vardot/varbase_ai_search_base
          ref: 1.0.x
          ssh-key: ${{ secrets.VARBASE_AI_SEARCH_DEPLOY_KEY }}
          path: varbase_ai_search_base

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, pdo_mysql, mysqli, mbstring, intl, zip, bcmath, opcache, pcntl
          # As a served site runs: assertions off (Vardot's recipe CI does the
          # same, for an upstream SDC prop mismatch in media rendering).
          ini-values: memory_limit=-1, zend.assertions=-1
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-varbase-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('recipe/composer.json') }}
          restore-keys: composer-varbase-${{ runner.os }}-${{ env.PHP_VERSION }}-

      - name: Build a Varbase 11 site that requires this checkout
        run: |
          # The Varbase project template, as Vardot's public recipe CI uses it,
          # with Varbase's curated patches. Retried: drupal.org clones can reset.
          for i in 1 2 3; do
            composer create-project drupal/varbase_project:11.0.x-dev site --no-install --no-interaction --no-scripts --ignore-platform-req=ext-pgsql && break
            echo "create-project attempt $i failed, retrying"; rm -rf site; sleep 20
          done
          cd site
          # Temporary pin. vardot/varbase-patches 11.0.48 (8 October 2026) re-rolled
          # the tagify #3555084 patch (MR 270) against a base no tagify release
          # matches, so composer-patches, which uses git apply, cannot apply it
          # to tagify 1.2.53, 1.2.54 or 1.2.55. 11.0.47's patch (MR 177) applies
          # to tagify up to 1.2.54. Drop both pins once the patch is re-rolled.
          composer require --no-update vardot/varbase-patches:11.0.47 drupal/tagify:1.2.54
          composer config minimum-stability dev
          composer config repositories.recipe "{\"type\": \"path\", \"url\": \"../recipe\", \"options\": {\"symlink\": false, \"versions\": {\"${PACKAGE}\": \"1.0.x-dev\"}}}"
          composer config repositories.varbase_ai_search_base '{"type": "path", "url": "../varbase_ai_search_base", "options": {"symlink": false, "versions": {"vardot/varbase_ai_search_base": "1.0.x-dev"}}}'
          composer config --json extra.drupal-recipe-unpack.ignore "[\"${PACKAGE}\", \"vardot/varbase_ai_search_base\"]"
          # MariaDB is the test's vector database. Twig stays below 3.30, which
          # breaks the cva module Varbase uses (as Vardot's recipe CI pins it).
          for i in 1 2 3; do
            composer require "${PACKAGE}:1.0.x-dev" drupal/ai_vdb_provider_mariadb:^1.0 "twig/twig:<3.30" -W --no-interaction --ignore-platform-req=ext-pgsql && break
            echo "require attempt $i failed, retrying"; sleep 15
          done
          test -d web/core
          composer show --no-ansi | grep -E 'drupal/(core|canvas|ai|ai_search|ai_answers|ai_agents|varbase_search_base|varbase_starter|ai_vdb_provider_mariadb|vartheme_bs5) |vardot/|twig/twig |drupal/tagify '

      - name: Patch core 2741429, as Vardot's recipe CI does
        working-directory: site
        run: |
          # A guard for a NULL view mode in EntityDisplayBase that a Varbase
          # install can hit before vardot/varbase-patches is active.
          curl -fsSL -o /tmp/2741429.patch "https://raw.githubusercontent.com/Vardot/drupal-core-patches/refs/heads/patches/drupal-core--2026-07-02--2741429--entitydisplaybase-null-mode-entity.patch"
          if patch -p1 -d web --forward --dry-run < /tmp/2741429.patch; then
            patch -p1 -d web --forward < /tmp/2741429.patch
          else
            echo "core 2741429 already applied"
          fi

      - name: Install Varbase Starter
        working-directory: site
        run: |
          bin/drush site:install "$PWD/recipes/varbase_starter" --db-url=mysql://root:root@127.0.0.1:3306/drupal \
            --account-name=admin --account-pass=admin --site-name="Recipe CI" --locale=en -y
          bin/drush cr

      - name: Apply Varbase Search Base, before any vector database provider
        working-directory: site
        run: |
          # The MariaDB provider's search_api_index_update hook assumes every
          # index has a server, and the keyword index Drupal CMS Search creates
          # has none while it is set up (see README, known issues).
          bin/drush recipe "$PWD/recipes/varbase_search_base"
          bin/drush cr

      - name: Set a default embeddings model and vector database, without an AI key
        working-directory: site
        run: |
          # The Echo provider ships with the AI module as a test module. It
          # answers every embeddings call locally, so nothing needs a key.
          chmod u+w web/sites/default web/sites/default/settings.php
          echo "\$settings['extension_discovery_scan_tests'] = TRUE;" >> web/sites/default/settings.php
          bin/drush cr
          bin/drush pm:install ai_test ai_vdb_provider_mariadb -y
          bin/drush php:eval '\Drupal::configFactory()->getEditable("ai.settings")->set("default_providers.embeddings", ["provider_id" => "echoai", "model_id" => "gpt-test"])->save();'
          bin/drush config:set ai.settings default_vdb_provider mariadb -y
          # The vector database is named varbase_ai_search; for MariaDB that is
          # a real database the site's user must be able to open.
          bin/drush sql:query "CREATE DATABASE IF NOT EXISTS varbase_ai_search"
          bin/drush cr

      - name: Enable AI Answers first
        working-directory: site
        run: |
          # Canvas only generates the AI Answers block components outside a
          # recipe apply, so AI Answers is enabled first (see README).
          bin/drush pm:install ai_answers -y
          bin/drush cr

      - name: Apply the recipe
        working-directory: site
        run: |
          bin/drush recipe "$PWD/recipes/${RECIPE}"
          bin/drush cr

      - name: Apply the Ask AI pattern, a recipe of its own for Vartheme BS5 sites
        working-directory: site
        run: |
          bin/drush recipe "$PWD/recipes/${RECIPE}/patterns/ask_ai"
          bin/drush cr

      - name: Check the recipe without an AI key
        working-directory: site
        run: |
          # The checks run inline: the recipe ships no PHP file. Each prints PASS or FAIL,
          # then RESULT, and a failure throws so that drush exits non-zero.
          bin/drush php:eval "$(cat <<'PHP'
          // Optional arguments of the old tests/verify.php; CI passes only these.
          $extra = [];
          $failed = FALSE;
          $check = function (string $label, bool $ok, string $detail = '') use (&$failed): void {
            if (!$ok) {
              $failed = TRUE;
            }
            echo sprintf("%-4s %s%s\n", $ok ? 'PASS' : 'FAIL', $label, $detail !== '' ? " ($detail)" : '');
          };

          $module_handler = \Drupal::moduleHandler();
          foreach (['ai_search', 'ai_agents', 'ai_answers', 'canvas'] as $module) {
            $check("module $module enabled", $module_handler->moduleExists($module));
          }

          // Varbase AI Search, applied first by this recipe.
          $check('vector index content_vector exists', \Drupal\search_api\Entity\Index::load('content_vector') !== NULL, 'from Varbase AI Search');

          $etm = \Drupal::entityTypeManager();
          $agent = $etm->getStorage('ai_agent')->load('varbase_ai_answers');
          $check('agent varbase_ai_answers exists', $agent !== NULL);
          if ($agent) {
            $check('agent uses the RAG search tool', !empty($agent->get('tools')['ai_search:rag_search']));
            $limit = $agent->get('tool_usage_limits')['ai_search:rag_search']['index'] ?? [];
            $check('agent is locked to content_vector', ($limit['action'] ?? '') === 'force_value' && ($limit['values'] ?? []) === ['content_vector']);
          }

          $wired = FALSE;
          foreach ((array) \Drupal::config('ai_answers.agents')->get('agents') as $row) {
            if (($row['id'] ?? '') === 'varbase_ai_answers' && !empty($row['enabled'])) {
              $wired = TRUE;
            }
          }
          $check('AI Answers uses the agent', $wired);

          foreach (['anonymous', 'authenticated'] as $rid) {
            $check("$rid may use AI Answers", (bool) \Drupal\user\Entity\Role::load($rid)?->hasPermission('use ai answers'));
          }

          $pattern = $etm->getStorage('pattern')->load('varbase_ask_ai');
          $check('Ask AI pattern exists', $pattern !== NULL);
          if ($pattern) {
            $components = $etm->getStorage('component');
            foreach ($pattern->get('component_tree') as $item) {
              $component = $components->load($item['component_id']);
              $known = $component ? $component->getVersions() : [];
              $check(
                "pattern component {$item['component_id']} at {$item['component_version']}",
                $component !== NULL && in_array($item['component_version'], $known, TRUE),
                $component ? 'active ' . $component->getActiveVersion() : 'component missing',
              );
            }
          }

          echo $failed ? "RESULT: FAIL\n" : "RESULT: PASS\n";

          // drush php:script reports success whatever the script printed, so end
          // normally on PASS and throw on FAIL to get a non-zero status.
          if ($failed) {
            throw new \RuntimeException('One or more checks failed.');
          }
          PHP
          )"

      - name: Serve the site for the functional tests
        working-directory: site
        run: |
          # The Webmaster in cucumber.shared.js is uid 1.
          bin/drush php:eval '$u = \Drupal\user\Entity\User::load(1); $u->setUsername("webmaster"); $u->setEmail("webmaster@example.test"); $u->setPassword("dD.123123ddd"); $u->save();'
          # Headless test prep, as Vardot's recipe CI does on Varbase sites.
          bin/drush pm:uninstall antibot big_pipe seckit -y || true
          bin/drush config:set system.performance css.preprocess 0 -y
          bin/drush config:set system.performance js.preprocess 0 -y
          bin/drush cr
          # Drupal expects the docroot as the working directory: from anywhere else
          # plugin discovery finds nothing and every page is a 500.
          (cd web && PHP_CLI_SERVER_WORKERS=8 nohup php -S 127.0.0.1:8080 .ht.router.php > /tmp/php-server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8080/user/login && break; sleep 2; done
          curl -s -o /dev/null -w 'user/login: HTTP %{http_code}\n' http://127.0.0.1:8080/user/login

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the functional tests (Playwright + Cucumber)
        working-directory: recipe
        env:
          LAUNCH_URL: http://127.0.0.1:8080
        run: |
          echo "nodeLinker: node-modules" > .yarnrc.yml
          corepack enable
          # varbase-e2e's postinstall can rewrite cucumber.js; keep ours.
          cp cucumber.js /tmp/cucumber.js.bak
          yarn install
          cp /tmp/cucumber.js.bak cucumber.js
          ./node_modules/.bin/playwright install --with-deps chromium
          yarn test

      - name: Keep the test reports and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: functional-tests
          path: |
            recipe/tests/reports/
            recipe/tests/screenshots/
            /tmp/php-server.log
          if-no-files-found: ignore
